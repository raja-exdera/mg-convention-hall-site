<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery | Saptha Aradhana Convention Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif'],display:['Instrument Serif','serif']}}}}</script>
<link rel="stylesheet" href="../css/styles.css"></head>
<body class="antialiased">
<div id="site-header"></div>
<main>
  <section class="gallery-hero-section">
    <div class="lux-container">
      <div class="gallery-header-row reveal">
        <div>
          <p class="section-kicker">Visual Archive</p>
          <h1 class="section-title">Explore the venue.</h1>
        </div>
        <p class="section-side-copy muted">
          Hall, hospitality, dining and celebration spaces at Saptha Aradhana Convention Hall.
        </p>
      </div>

      <div class="gallery-filter-wrapper reveal">
        <div class="filter-bar">
          <button data-filter="all" class="filter-btn active">All Spaces</button>
          <button data-filter="hall" class="filter-btn">Hall & Exterior</button>
          <button data-filter="dining" class="filter-btn">Dining</button>
          <button data-filter="rooms" class="filter-btn">Rooms & Suites</button>
          <button data-filter="garden" class="filter-btn">Garden & Lawns</button>
          <button data-filter="conference" class="filter-btn">Conference & Lounge</button>
          <button data-filter="parking" class="filter-btn">Parking & Arrival</button>
        </div>
      </div>

      <div id="gallery-grid" class="gallery-grid mt-10"></div>
    </div>
  </section>
</main><div id="site-footer"></div>
<div id="lightbox" class="lightbox" aria-hidden="true"><button id="lightbox-close" class="lightbox-close" aria-label="Close">×</button><img id="lightbox-image" src="" alt=""><div id="lightbox-caption" class="lightbox-caption"></div></div>
<script src="../js/config.js"></script><script src="../js/components.js"></script><script src="../js/gallery.js"></script><script src="../js/app.js"></script></body></html>
